services:
  music163:
    image: local/163help-client:5.1-arm64-libo.2
    build:
      context: ..
      dockerfile: apps/docker/Dockerfile
    container_name: 163music-docker-client
    restart: unless-stopped
    init: true
    mem_limit: 1g
    shm_size: 256m
    environment:
      UI_PASSWORD: ${UI_PASSWORD:?Set UI_PASSWORD in a private env file}
      TZ: Asia/Shanghai
    ports:
      - 127.0.0.1:13000:3000
    volumes:
      - ${DATA_DIR:?Set an absolute persistent DATA_DIR}:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
