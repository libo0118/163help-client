name: Build docker client

on:
  push:
    tags: ['docker-v5*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GHCR 包 ghcr.io/y08lin4/163help-client/docker-client 实际归属改名前的
          # 163help-client-legacy 仓库，本仓 GITHUB_TOKEN 对它无写权限（2026-09 CI
          # 断供根因）。改走用户级 PAT（write:packages，可写该用户名下所有 package）；
          # secret 未配置时回退 GITHUB_TOKEN（仅当包归属已修复时可用）。
          username: ${{ secrets.GHCR_USER || 'y08lin4' }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/y08lin4/163help-client/docker-client
          tags: |
            type=raw,value=latest
            type=ref,event=tag
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
